services:
  db:
    image: mariadb:11.8
    container_name: association-dev-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?missing}
      MARIADB_USER: ${DB_USER:?missing}
      MARIADB_PASSWORD: ${DB_PASSWORD:?missing}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?missing}
    ports:
      - "${DB_HOST_PORT:-3308}:${DB_CONTAINER_PORT:-3306}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - db_data_dev:/var/lib/mysql

volumes:
  db_data_dev:
