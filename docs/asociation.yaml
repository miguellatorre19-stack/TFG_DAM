openapi: 3.0.1
info:
  title: API asociation
  version: 1.0.0
  description: API for memebership and activities of an asociation
servers:
  - url: 'https://api.example.com/api'
paths:
  /v1/socios:
    get:
      summary: Devuelve lista de socios
      description: |
        Devuelve una lista de todos los socios miembros de la asociacion
        se permite filtrar por 3 campos simultáneamente: 
          -familyModel
          -active
          -entryDate
      parameters:
        - name: familyModel
          in: query
          description: Filtro por modelo familiar
          required: false
          schema:
            type: string
            example: Nuclear

        - name: active
          in: query
          description: Filtro por estado de activo
          required: false
          schema:
            type: boolean
            example:
              value: true

        - name: entryDate
          in: query
          description: Filtro por fecha de entrada (filtra todos los socios que entraron después)
          required: false
          schema:
            type: string
            format: date
            example: '2025-04-07'

      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocioDto'
              examples:
                CasoÉxito1:
                  $ref: '#/components/examples/socioDtoExample1'
                CasoÉxito2:
                  $ref: '#/components/examples/socioDtoExample2'
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError 404'
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError 500'
    post:
      summary: Sube un nuevo socio
      description: Añadir nuevo socio al registro
      requestBody:
        description: Datos del Socio
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Socio'
            examples:
              Caso1:
                $ref: '#/components/examples/socioExample1'
              Caso2:
                $ref: '#/components/examples/socioExample2'
              BadCase:
                $ref: '#/components/examples/socioExampleBad'
      responses:
        201:
          description: Socio creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Socio'
              examples:
                CasoÉxito1:
                  $ref: '#/components/examples/socioExample1'
                CasoÉxito2:
                  $ref: '#/components/examples/socioExample2'
        400:
          description: Error en campos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest400*'
        409:
          description: Socio ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict 409'
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError 500'
  /v1/socios/{id}:
    get:
      summary: Devuelve socio por id
      description: Busca el socio individual que tiene el id indicado
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocioDto'
              examples:
                Example1:
                  $ref: '#/components/examples/socioDtoExample1'
                Example2:
                  $ref: '#/components/examples/socioDtoExample2'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError 404'
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError 500'
    put:
      summary: Editar socio por id
      description: Editar socio cuyo id coincide con la búsqueda
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Socio'
            examples:
              Example1:
                $ref: '#/components/examples/socioExample1'
              Example2:
                $ref: '#/components/examples/socioExample2'
              BadCase:
                $ref: '#/components/examples/socioExampleBad'
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Socio'
              examples:
                Example:
                  $ref: '#/components/examples/socioExample1'
        400:
          description: Datos editados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest400*'
              example:
                $ref: '#/components/examples/socioExampleBad'
        404:
          description: Socio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError 404'
        409:
          description: Conflicto con data ya existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict 409'
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError 500'
    delete:
      summary: Da de baja socio por id
      description: Da de baja socio cuyo id coincide con la búsqueda. Inactiva participantes asociados y desactiva usuarios
      responses:
        204:
          description: Borrado exitoso
        404:
          description: Socio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError 404'
        409:
          description: Ya fue dado de baja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict 409'
        '500':
          description: server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError 500'
  /v1/participantes:
    get:
      summary: Devuelve lista de participantes
      description: |
        Devuelve una lista de todos los participantes miembros de la asociacion
        se permite filtrar por 3 campos simultáneamente: 
          -typeRel
          -name
          -birthDate
      parameters:
        - name: typeRel
          in: query
          description: Filtro por tipo de relación
          required: false
          schema:
            type: string
          example: cónjuge
        - name: name
          in: query
          description: Filtro por nombre (iniciales)
          required: false
          schema:
            type: string
          example: Juanjo
        - name: birthDate
          in: query
          description: Filtro por fecha de nacimiento (filtra todos los que nacieron después)
          required: false
          schema:
            type: string
            format: date
          example: 1983-12-04
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParticipanteOutDto'
              examples:
                CasoÉxito1:
                  $ref: '#/components/examples/participanteExample1'
                CasoÉxito2:
                  $ref: '#/components/examples/participanteExample2'
        404:
          description: Participante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError 404'
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError 500'
