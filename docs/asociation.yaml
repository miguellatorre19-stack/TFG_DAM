components:
  schemas:
    Socio:
      type: object
      required: [ dni, name, surname, email, phoneNumber ]
      properties:
        id:
          type: integer
          format: int64
          description: id de socio
        dni:
          type: string
          pattern: '^[0-9]{8}[A-Z]$'
          description: dni de socio
        name:
          type: string
          description: nombre de socio
        surname:
          type: string
          description: apellidos de socio
        email:
          type: string
          format: email
          description: email de socio
        address:
          type: string
          description: direccion de vivienda de socio
        phoneNumber:
          type: string
          pattern: '^\d{3}-\d{3}-\d{3}$'
          description: nº de telefono de socio
        familyModel:
          type: string
          description: tipo de modelo familiar
        active:
          type: boolean
          description: socio está activo o no
        entryDate:
          type: string
          format: date
          description: fecha de alta de socio
        outDate:
          type: string
          format: date
          nullable: true
          description: fecha de baja de socio
    SocioDto:
      type: object
      properties:
        id:
          description: id de socio
          type: integer
          format: int64
        dni:
          description: dni de socio
          type: string
          pattern: '^[0-9]{8}[A-Z]$'
        name:
          description: nombre de socio
          type: string
        surname:
          description: apellidos de socio
          type: string
        email:
          description: email de socio
          type: string
          format: email
        phoneNumber:
          description: nº de telefono de socio
          type: string
          pattern: '^\d{3}-\d{3}-\d{3}$'
        familyModel:
          description: tipo de modelo familiar
          type: string
        active:
          description: socio está activo o no
          type: boolean
        entryDate:
          description: fecha de alta de socio
          type: string
          format: date
        participanteDtoList:
          type: array
          items:
            $ref: '#/components/schemas/ParticipanteDto'
    ParticipanteDto:
      type: object
      properties:
        dni:
          description: dni de participante
          type: string
          pattern: '^[0-9]{8}[A-Z]$'
        name:
          description: nombre de participante
          type: string
        surname:
          description: apellido de participante
          type: string
        email:
          type: string
          format: email
          description: email de participante
        phoneNumber:
          description: nº de telefono de participante
          type: string
          pattern: '^\d{3}-\d{3}-\d{3}$'
        birthDate:
          description: fecha de nacimiento de participante
          type: string
          format: date
        needs:
          description: necesidades especiales de participante
          type: string
        typeRel:
          description: tipo de relación del participante respecto a su socio
          type: string
        socioID:
          description: id del socio asociado
          type: integer
          format: int64
    ParticipanteOutDto:
      type: object
      properties:
        id:
          description: id de participante
          type: integer
          format: int64
        dni:
          description: dni de participante
          type: string
          pattern: '^[0-9]{8}[A-Z]$'
        name:
          description: nombre de participante
          type: string
        surname:
          description: apellido de participante
          type: string
        email:
          type: string
          format: email
          description: email de participante
        phoneNumber:
          description: nº de telefono de participante
          type: string
          pattern: '^\d{3}-\d{3}-\d{3}$'
        birthDate:
          description: fecha de nacimiento de participante
          type: string
          format: date
        needs:
          description: necesidades especiales de participante
          type: string
        typeRel:
          description: tipo de relación del participante respecto a su socio
          type: string
        socioID:
          description: id del socio asociado
          type: integer
          format: int64
    Actividad:
      type: object
      required: [ description, dayActivity, typeActivity, duration, canJoin, capacity ]
      properties:
        id:
          description: id de actividad
          type: integer
          format: int64
        description:
          description: descripción de la actividad
          type: string
        dayActivity:
          description: dia de la actividad
          type: string
          format: date
        typeActivity:
          description: tipo de actividad
          type: string
        duration:
          description: tiempo de duración
          type: number
          format: float
        canJoin:
          description: el plazo para apuntarse a la actividad está abierto o no
          type: boolean
        capacity:
          description: máximo de personas posible
          type: integer
        place:
          $ref: '#/components/schemas/Ubicacion'
    ActividadDto:
      type: object
      required: [ description, duration, canJoin, capacity ]
      properties:
        description:
          description: descripción de la actividad
          type: string
        dayActivity:
          description: dia de la actividad
          type: string
          format: date
        typeActivity:
          description: tipo de actividad
          type: string
        duration:
          description: tiempo de duración
          type: number
          format: float
        canJoin:
          description: el plazo para apuntarse a la actividad está abierto o no
          type: boolean
        capacity:
          description: máximo de personas posible
          type: integer
        status:
          description: estado de la actividad
          type: string
          example: ACTIVE
    ActividadOutDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          description: descripción de la actividad
          type: string
        dayActivity:
          description: dia de la actividad
          type: string
          format: date
        duration:
          description: tiempo de duración
          type: number
          format: float
        canJoin:
          description: el plazo para apuntarse a la actividad está abierto o no
          type: boolean
        typeActivity:
          description: tipo de actividad
          type: string
        capacity:
          description: máximo de personas posible
          type: integer
        status:
          description: estado actual de la actividad
          type: enum
        participanteDtoList:
          type: array
          items:
            $ref: '#/components/schemas/ParticipanteDto'
    InscripcionActividadRequestDto:
      type: object
      required: [ price, state, participanteId ]
      properties:
        price:
          type: number
          format: float
          description: precio aplicado a la inscripción
        state:
          type: string
          description: estado de la inscripción (por ejemplo ACTIVE)
        participanteId:
          type: integer
          format: int64
          description: ID del participante a inscribir
    SolicitudServicioRequestDto:
      type: object
      required: [ price, state, participanteId ]
      properties:
        price:
          type: number
          format: float
          description: precio asociado a la solicitud
        state:
          type: string
          description: estado de la solicitud
          example: PENDING
        participanteId:
          type: integer
          format: int64
          description: ID del participante que solicita el servicio
    SolicitudServicioOutDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: id de la solicitud
        createdAt:
          type: string
          format: date
          description: fecha de creacion de la solicitud
        state:
          type: string
          description: estado actual de la solicitud
          example: PENDING
        price:
          type: number
          format: float
          description: precio asociado a la solicitud
        participanteId:
          type: integer
          format: int64
          description:
            ID del participante solicitante
