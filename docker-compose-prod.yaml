services:
  db:
    image: mariadb:11.8
    container_name: association-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?missing}
      MARIADB_USER: ${DB_USER:?missing}
      MARIADB_PASSWORD: ${DB_PASSWORD:?missing}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?missing}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "${DB_HOST_PORT:-3308}:${DB_CONTAINER_PORT:-3306}"
    volumes:
      - db_data:/var/lib/mysql

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: association-api
    container_name: association-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev-docker
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?missing}
      DB_USER: ${DB_USER:?missing}
      DB_PASSWORD: ${DB_PASSWORD:?missing}
      JWT_SECRET: ${JWT_SECRET:?missing}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

volumes:
  db_data:
